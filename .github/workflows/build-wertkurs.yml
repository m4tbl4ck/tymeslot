name: Build wertkurs image

# Baut das Tymeslot-Image mit dem wertkurs-Theme und pusht es nach GHCR.
# Laeuft auf GitHub-Runnern, nicht auf dem VPS.
on:
  push:
    branches: [wertkurs-theme]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zusaetzlicher Image-Tag (z.B. v1.17.0-wertkurs)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tymeslot-wertkurs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,format=short

      # release-slim = Image ohne eingebettetes PostgreSQL.
      # Die Coolify-Installation nutzt einen separaten postgres:17-alpine Container.
      - name: Build and push (release-slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.docker
          target: release-slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image gebaut" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY